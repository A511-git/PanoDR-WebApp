[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panodr-webapp"
version = "0.1.0"
description = "Web application for PanoDR: Spherical Panorama Diminished Reality for Indoor scenes (CVPRW 2021)"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "VasilisGks" },
]
keywords = [
    "diminished-reality",
    "spherical-panorama",
    "inpainting",
    "deep-learning",
    "computer-vision",
    "streamlit",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "imutils>=0.5.3",
    "numpy>=1.17.4",
    "streamlit>=1.1.0",
    "torch>=1.6.0",
    "torchvision",
    "imageio>=2.9.0",
    "Pillow>=8.1.0",
    "opencv-python-headless",
    "streamlit-drawable-canvas>=0.8.0",
    "lxml",
    "typing-extensions>=3.10.0.2",
    "scipy>=1.7.3",
    "pycloudflared>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[project.scripts]
panodr-webapp = "app:parseArguments"
panodr-tunnel = "tunnel:main"
panodr-run = "run_with_tunnel:main"

[project.urls]
Homepage = "https://github.com/VasilisGks/PanoDR-WebApp"
Repository = "https://github.com/VasilisGks/PanoDR-WebApp.git"

[tool.setuptools]
py-modules = [
    "app",
    "data",
    "helpers",
    "input",
    "panorama",
    "poissonimageeditting",
    "tunnel",
    "run_with_tunnel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*"]
